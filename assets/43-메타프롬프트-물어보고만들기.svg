<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 320" role="img" aria-label="막막함, AI가 묻고 내가 답하기, 완성된 프롬프트를 고쳐 보내기" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<rect width="1080" height="320" fill="#fffaf3"/>
<text x="540" y="52" text-anchor="middle" font-size="30" font-weight="800" fill="#273943">프롬프트가 막히면 AI에게 물어보기</text>
<g><rect x="40" y="86" width="300" height="150" rx="18" fill="#fff" stroke="#e8772e" stroke-width="3"/>
<rect x="40" y="86" width="300" height="44" rx="18" fill="#e8772e"/><rect x="40" y="112" width="300" height="18" fill="#e8772e"/>
<text x="190.0" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">1 · 막막할 때</text>
<text x="190.0" y="176" text-anchor="middle" font-size="19" fill="#273943">“뭘 부탁할지</text>
<text x="190.0" y="206" text-anchor="middle" font-size="19" fill="#273943">모르겠어”</text></g><g><rect x="400" y="86" width="300" height="150" rx="18" fill="#fff" stroke="#3d7aa8" stroke-width="3"/>
<rect x="400" y="86" width="300" height="44" rx="18" fill="#3d7aa8"/><rect x="400" y="112" width="300" height="18" fill="#3d7aa8"/>
<text x="550.0" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">2 · AI가 묻고 내가 답함</text>
<text x="550.0" y="176" text-anchor="middle" font-size="19" fill="#273943">필요한 것을</text>
<text x="550.0" y="206" text-anchor="middle" font-size="19" fill="#273943">하나씩 3개만</text></g><g><rect x="760" y="86" width="300" height="150" rx="18" fill="#fff" stroke="#6a9a6f" stroke-width="3"/>
<rect x="760" y="86" width="300" height="44" rx="18" fill="#6a9a6f"/><rect x="760" y="112" width="300" height="18" fill="#6a9a6f"/>
<text x="910.0" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">3 · 내가 고쳐 보냄</text>
<text x="910.0" y="176" text-anchor="middle" font-size="19" fill="#273943">완성된 프롬프트를</text>
<text x="910.0" y="206" text-anchor="middle" font-size="19" fill="#273943">읽고 고쳐서 전송</text></g><text x="370.0" y="176" text-anchor="middle" font-size="40" font-weight="700" fill="#e8772e">→</text><text x="730.0" y="176" text-anchor="middle" font-size="40" font-weight="700" fill="#e8772e">→</text>
<text x="540" y="284" text-anchor="middle" font-size="19" fill="#5b6b73">아직 만들지는 말고, 프롬프트만 써 달라고 부탁합니다.</text></svg>