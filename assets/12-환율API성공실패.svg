<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
<title id="title">환율 API의 성공과 실패 구분하기</title>
<desc id="desc">100 USD로 요청한 뒤 실제 환율 JSON의 통화, 양수 환율, 기준일과 조회시각을 검사합니다. 실제 연결 성공은 LIVE와 apiConnectionVerified: true로 확인합니다. 실패는 error.json에 남깁니다. 실패 뒤 사람이 별도 DEMO 명령을 실행할 수 있습니다. 고정 환율 1,350을 쓰며 실제 연결 성공이 아닙니다. 200 USD의 참고 원화금액은 이번 rate 곱하기 200을 반올림한 값입니다. 고정 정답 환율은 없습니다.</desc>
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#f63c51" stroke-width="1.8"/></marker></defs>
<rect x="64" y="180" width="430" height="190" rx="18" fill="#f7f7f9" stroke="#d9dce3" stroke-width="2"/>
<rect x="638" y="180" width="738" height="190" rx="18" fill="#fcecef" stroke="#f63c51" stroke-width="2"/>
<path d="M 499 277 L 630 277" fill="none" stroke="#f63c51" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1007 375 L 1007 415 L 376 415 L 376 459" fill="none" stroke="#f63c51" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1007 415 L 1060 415 L 1060 459" fill="none" stroke="#f63c51" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="64" y="465" width="632" height="195" rx="18" fill="#fcecef" stroke="#f63c51" stroke-width="2"/>
<rect x="744" y="465" width="632" height="195" rx="18" fill="#f7f7f9" stroke="#d9dce3" stroke-width="2"/>
<path d="M 1060 665 L 1060 728" fill="none" stroke="#f63c51" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="64" y="735" width="632" height="205" rx="18" fill="#f7f7f9" stroke="#d9dce3" stroke-width="2"/>
<rect x="744" y="735" width="632" height="205" rx="18" fill="#fcecef" stroke="#f63c51" stroke-width="2"/>
<text x="64" y="42" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="38" font-weight="700" fill="#161616">D05  /  환율 API의 성공과 실패 구분하기</text>
<text x="64" y="103" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">국내비용과 USD 참고액은 따로 보여 줍니다. 두 금액을 합산하지 않습니다.</text>
<text x="88" y="204" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">100 USD로 요청</text>
<text x="88" y="257" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">제공 briefing.cjs 실행</text>
<text x="88" y="295" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">국내비용 요약은 별도 읽기</text>
<text x="662" y="204" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">실제 환율 JSON 검사</text>
<text x="662" y="257" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">base: USD / quote: KRW / rate &gt; 0</text>
<text x="662" y="295" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">date: 기준일 / queriedAt: 조회시각</text>
<text x="88" y="489" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">성공 · LIVE</text>
<text x="88" y="542" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">apiConnectionVerified: true</text>
<text x="88" y="580" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">rate × 100 → 원 단위 반올림</text>
<text x="768" y="489" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">실패 · error.json</text>
<text x="768" y="542" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">이번 실행 실패를 기록</text>
<text x="768" y="580" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">정상 결과가 남아 있어도 성공 아님</text>
<text x="88" y="759" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">금액만 200 USD로 다시 실행</text>
<text x="88" y="812" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">이번 rate × 200 → 반올림</text>
<text x="88" y="850" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">고정 정답 없음 · 조회시각 확인</text>
<text x="88" y="888" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">국내비용과 합산하지 않습니다.</text>
<text x="768" y="759" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">사람이 별도 DEMO 명령 실행</text>
<text x="768" y="812" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">고정 환율 1,350 · 교육 예시</text>
<text x="768" y="850" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">apiConnectionVerified: false</text>
<text x="768" y="888" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">실제 연결 성공 아님</text>
<text x="64" y="982" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#161616">실패를 DEMO로 자동 대체하지 않습니다. DEMO 결과는 output/api-demo에 따로 저장합니다.</text>
</svg>