<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
<title id="title">오늘 만드는 결과를 한눈에 보기</title>
<desc id="desc">오전 설명·시연 뒤 오후에 체크리스트와 회의록 스킬을 만들고 Excel 보고서의 숫자와 오류를 확인합니다. CLAUDE.md와 Skill로 절차를 남긴 뒤 세 담당자에게 위임하고 새 입력에 재사용합니다. 같은 비용 업무를 로그인 실행 버튼과 파일 변경 감시로 실행합니다. 개인 실습이며 A1–A8와 스킬 인터뷰 요청을 구분합니다. 오전 3H는 설명·강사 시연, 오후 5H는 개인 실습입니다.</desc>
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#f63c51" stroke-width="1.8"/></marker></defs>
<rect x="64" y="205" width="240" height="210" rx="18" fill="#f7f7f9" stroke="#d9dce3" stroke-width="2"/>
<path d="M 306 310 L 329 310" fill="none" stroke="#f63c51" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="332" y="205" width="240" height="210" rx="18" fill="#f7f7f9" stroke="#d9dce3" stroke-width="2"/>
<path d="M 574 310 L 597 310" fill="none" stroke="#f63c51" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="600" y="205" width="240" height="210" rx="18" fill="#fcecef" stroke="#f63c51" stroke-width="2"/>
<path d="M 842 310 L 865 310" fill="none" stroke="#f63c51" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="868" y="205" width="240" height="210" rx="18" fill="#f7f7f9" stroke="#d9dce3" stroke-width="2"/>
<path d="M 1110 310 L 1133 310" fill="none" stroke="#f63c51" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1136" y="205" width="240" height="210" rx="18" fill="#f7f7f9" stroke="#d9dce3" stroke-width="2"/>
<rect x="64" y="470" width="408" height="190" rx="18" fill="#f7f7f9" stroke="#d9dce3" stroke-width="2"/>
<rect x="516" y="470" width="408" height="190" rx="18" fill="#fcecef" stroke="#f63c51" stroke-width="2"/>
<rect x="968" y="470" width="408" height="190" rx="18" fill="#f7f7f9" stroke="#d9dce3" stroke-width="2"/>
<text x="64" y="42" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="38" font-weight="700" fill="#161616">D01  /  오늘 만드는 결과를 한눈에 보기</text>
<text x="64" y="103" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">한 사람씩 직접 만들고 확인합니다. 완성한 결과를 다음 단계에서 다시 씁니다.</text>
<text x="88" y="229" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">1. 작품·스킬</text>
<text x="88" y="282" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">첫 웹·회의록 스킬</text>
<text x="88" y="320" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">재사용 → grill-me</text>
<text x="356" y="229" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">2. 보고서·검사</text>
<text x="356" y="282" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">사본 수정·추가</text>
<text x="356" y="320" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">오류 → 정상 복구</text>
<text x="624" y="229" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">3. 규칙·Skill</text>
<text x="624" y="282" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">공통 규칙 남기기</text>
<text x="624" y="320" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">한 업무 절차 호출</text>
<text x="892" y="229" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">4. 팀·재사용</text>
<text x="892" y="282" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">세 담당자 검수</text>
<text x="892" y="320" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">다음 주 입력</text>
<text x="1160" y="229" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">5. 실행·자동화</text>
<text x="1160" y="282" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">기존 로그인 앱</text>
<text x="1160" y="320" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">파일 변경 감시</text>
<text x="88" y="494" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">개인 실습</text>
<text x="88" y="547" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">내 기준을 정합니다.</text>
<text x="88" y="585" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">내 결과를 확인합니다.</text>
<text x="540" y="494" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">모델 요청 위치</text>
<text x="540" y="547" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">A1–A8 · 인터뷰 별도</text>
<text x="540" y="585" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">코드는 다시 실행합니다.</text>
<text x="992" y="494" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">8H 과정</text>
<text x="992" y="547" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">오전 · 개념과 시연</text>
<text x="992" y="585" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">오후 · 개인 실습</text>
<text x="64" y="710" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="26" font-weight="400" fill="#161616">완료 기준: 파일이 생겼는지와 실제 숫자·동작이 맞는지를 함께 확인합니다.</text>
</svg>