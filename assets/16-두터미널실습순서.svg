<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1270" viewBox="0 0 1440 1270" role="img" aria-labelledby="title desc">
<title id="title">Claude가 켜고 파일만 바꿔 보기</title>
<desc id="desc">Claude 안에 시작 요청을 붙입니다. 별도 실행 창에서 로그를 보고, 탐색기에서 입력 사본을 교체합니다. 기본 원본 40건에서 시작한 뒤 탐색기에서 다음 주 파일을 넣고 실행 창의 generated와 12건을 확인합니다. 브라우저를 수동 새로고침한 뒤 skipped를 봅니다. 오류 실습은 watch를 따로 재시작합니다. 오류 파일 사본을 넣고 error 로그를 기다린 뒤 다음 주 정상 파일로 바꿉니다. 복구 generated와 ok: true를 확인한 뒤 Ctrl+C 또는 횟수 종료로 마칩니다. 파일 교체 사이에 해당 로그를 기다립니다.</desc>
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#f63c51" stroke-width="1.8"/></marker></defs>
