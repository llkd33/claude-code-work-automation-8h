<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">텍스트를 내려받아 내 요청으로 바꾸기</title>
<desc id="desc">복붙템플릿.zip을 내려받아 풀고 지금 단계의 .txt를 사본으로 엽니다. 대괄호 빈칸만 수정합니다. 설명은 사용순서 파일에, 실제 요청과 명령은 각 텍스트 파일에 있습니다. Claude_ 파일은 Claude Code 안에, 셸 명령은 새 터미널에 붙입니다. 파일내용은 지정된 .md 파일에 저장합니다. 실제 결과와 검사 기준을 확인합니다. A8은 앱이 자동으로 보내며 수동 요청 파일이 없습니다.</desc>
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#f63c51" stroke-width="1.8"/></marker></defs>
<rect x="64" y="195" width="240" height="210" rx="18" fill="#f7f7f9" stroke="#d9dce3" stroke-width="2"/>
<path d="M 306 295 L 329 295" fill="none" stroke="#f63c51" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="332" y="195" width="240" height="210" rx="18" fill="#f7f7f9" stroke="#d9dce3" stroke-width="2"/>
<path d="M 574 295 L 597 295" fill="none" stroke="#f63c51" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="600" y="195" width="240" height="210" rx="18" fill="#fcecef" stroke="#f63c51" stroke-width="2"/>
<path d="M 842 295 L 865 295" fill="none" stroke="#f63c51" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="868" y="195" width="240" height="210" rx="18" fill="#f7f7f9" stroke="#d9dce3" stroke-width="2"/>
<path d="M 1110 295 L 1133 295" fill="none" stroke="#f63c51" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1136" y="195" width="240" height="210" rx="18" fill="#f7f7f9" stroke="#d9dce3" stroke-width="2"/>
<rect x="64" y="470" width="632" height="195" rx="18" fill="#fcecef" stroke="#f63c51" stroke-width="2"/>
<rect x="744" y="470" width="632" height="195" rx="18" fill="#f7f7f9" stroke="#d9dce3" stroke-width="2"/>
<text x="64" y="42" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="38" font-weight="700" fill="#161616">D10  /  텍스트를 내려받아 내 요청으로 바꾸기</text>
<text x="64" y="103" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">지금 단계의 파일 하나만 열고, 빈칸을 고쳐 맞는 창에 붙입니다.</text>
<text x="88" y="219" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">1. 내려받기</text>
<text x="88" y="272" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">복붙템플릿.zip</text>
<text x="88" y="310" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">압축 풀기</text>
<text x="356" y="219" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">2. 사본 열기</text>
<text x="356" y="272" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">지금 단계 .txt</text>
<text x="356" y="310" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">텍스트 편집기</text>
<text x="624" y="219" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">3. 빈칸 수정</text>
<text x="624" y="272" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">[내 도구 제목]</text>
<text x="624" y="310" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">내 말로 바꾸기</text>
<text x="892" y="219" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">4. 복붙·실행</text>
<text x="892" y="272" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">요청 / 명령 구분</text>
<text x="892" y="310" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">한 파일씩 전달</text>
<text x="1160" y="219" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">5. 결과 확인</text>
<text x="1160" y="272" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">파일 · 숫자 · 동작</text>
<text x="1160" y="310" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">실패와 미확인 기록</text>
<text x="88" y="494" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">Claude 요청</text>
<text x="88" y="547" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">Claude Code 안에 붙입니다.</text>
<text x="88" y="585" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">원하는 결과와 확인 기준을 전달합니다.</text>
<text x="768" y="494" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">셸 명령 / 파일 내용</text>
<text x="768" y="547" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">명령은 새 터미널에서 실행합니다.</text>
<text x="768" y="585" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">규칙·정의는 안내된 파일에 저장합니다.</text>
<text x="64" y="725" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="25" font-weight="400" fill="#161616">A8은 앱 자동 호출입니다. 더블클릭과 Node 실행 중 하나만 합니다.</text>
</svg>