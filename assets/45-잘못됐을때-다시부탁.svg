<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 320" role="img" aria-label="이상하다고 말하기, 원본은 그대로 두고 다시 만들기, 숫자 직접 대조" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<rect width="1080" height="320" fill="#fffaf3"/>
<text x="540" y="52" text-anchor="middle" font-size="30" font-weight="800" fill="#273943">결과가 이상하면 이렇게 다시 부탁해요</text>
<g><rect x="40" y="86" width="300" height="150" rx="18" fill="#fff" stroke="#e8772e" stroke-width="3"/>
<rect x="40" y="86" width="300" height="44" rx="18" fill="#e8772e"/><rect x="40" y="112" width="300" height="18" fill="#e8772e"/>
<text x="190.0" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">1 · 말하기</text>
<text x="190.0" y="176" text-anchor="middle" font-size="19" fill="#273943">“방금 결과가</text>
<text x="190.0" y="206" text-anchor="middle" font-size="19" fill="#273943">이상해”</text></g><g><rect x="400" y="86" width="300" height="150" rx="18" fill="#fff" stroke="#3d7aa8" stroke-width="3"/>
<rect x="400" y="86" width="300" height="44" rx="18" fill="#3d7aa8"/><rect x="400" y="112" width="300" height="18" fill="#3d7aa8"/>
<text x="550.0" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">2 · 원본은 그대로</text>
<text x="550.0" y="176" text-anchor="middle" font-size="19" fill="#273943">다시 제대로</text>
<text x="550.0" y="206" text-anchor="middle" font-size="19" fill="#273943">만들어 달라고</text></g><g><rect x="760" y="86" width="300" height="150" rx="18" fill="#fff" stroke="#6a9a6f" stroke-width="3"/>
<rect x="760" y="86" width="300" height="44" rx="18" fill="#6a9a6f"/><rect x="760" y="112" width="300" height="18" fill="#6a9a6f"/>
<text x="910.0" y="116" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">3 · 직접 대조</text>
<text x="910.0" y="176" text-anchor="middle" font-size="19" fill="#273943">원본 숫자와</text>
<text x="910.0" y="206" text-anchor="middle" font-size="19" fill="#273943">결과를 비교</text></g><text x="370.0" y="176" text-anchor="middle" font-size="40" font-weight="700" fill="#e8772e">→</text><text x="730.0" y="176" text-anchor="middle" font-size="40" font-weight="700" fill="#e8772e">→</text>
<text x="540" y="284" text-anchor="middle" font-size="19" fill="#5b6b73">“원본 파일은 건드리지 마”를 꼭 함께 말합니다.</text></svg>