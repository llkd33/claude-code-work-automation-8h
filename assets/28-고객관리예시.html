<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한빛화학 · 고객 메모장</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f8fa;color:#202126;font:16px/1.6 system-ui,sans-serif}main{max-width:1060px;margin:40px auto;padding:24px}h1{font-size:32px;margin:8px 0}p{color:#64666f}.tag{color:#c34210;font-size:14px;font-weight:700}.panel{background:white;border:1px solid #dedfe4;border-radius:16px;padding:24px;margin:24px 0}form{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-weight:600}input,select,textarea,button{font:inherit}input,select,textarea{display:block;width:100%;border:1px solid #c3c6ce;border-radius:8px;padding:10px;margin:6px 0;background:white}textarea{min-height:70px;resize:vertical}button{border:0;border-radius:8px;padding:12px 20px;background:#d94508;color:white;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #386ef0;outline-offset:2px}.full{grid-column:1/-1}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:740px}th,td{text-align:left;padding:12px;border-bottom:1px solid #eee}td select{min-width:110px}#feedback{color:#a53710;min-height:26px}#empty{display:none}.summary{font-weight:700;color:#202126}footer{font-size:14px;color:#64666f}@media(max-width:620px){main{margin:12px auto;padding:16px}form{grid-template-columns:1fr}.panel{padding:16px}h1{font-size:26px}}
</style></head><body><main><div class="tag">미리 만든 교육용 예시 · 가상 고객</div><h1>상담 고객을 기억하는 메모장</h1><p>고객을 한 명 추가하고, 찾고, 상담 상태를 바꿔 보세요.</p><section class="panel"><h2>새 고객 추가</h2><form id="customer-form" novalidate><label>회사명<input id="company" required maxlength="80" placeholder="한빛테스트상사"></label><label>담당자<input id="contact" required maxlength="40" placeholder="홍예진"></label><label>관심 제품<input id="product" maxlength="80" placeholder="수분 세럼"></label><label>상담 상태<select id="new-status"><option>신규</option><option>상담중</option><option>후속연락</option><option>완료</option></select></label><label class="full">고객 메모<textarea id="memo" maxlength="500" placeholder="다음에 확인할 내용을 적어 보세요."></textarea></label><div class="full"><button type="submit">고객 추가</button></div></form><div id="feedback" role="status" aria-live="polite"></div></section><section class="panel"><h2>내 고객 목록</h2><label>회사명으로 검색<input id="search" type="search" placeholder="한빛"></label><p id="count" class="summary" aria-live="polite"></p><div class="table-wrap"><table><thead><tr><th>회사명</th><th>담당자</th><th>관심 제품</th><th>상담 상태</th><th>메모</th></tr></thead><tbody id="customers"></tbody></table></div><p id="empty">검색한 고객이 없습니다.</p></section><footer>이 예시는 메모 칸을 추가한 완성 모습입니다. 기록은 같은 브라우저·같은 주소에 남습니다. 서버 DB와 공유하지 않으며, 비공개 창·브라우저 데이터 삭제·주소 변경 시 기록이 보이지 않을 수 있습니다.</footer></main>
<script>
(()=>{
const KEY='hanbit.customer-lab.v1',statuses=['신규','상담중','후속연락','완료'];
const seeds=[{id:'C001',company:'새봄리테일',contact:'김하늘',product:'수분 세럼',status:'신규',memo:''},{id:'C002',company:'모아뷰티',contact:'이수아',product:'보습 크림',status:'상담중',memo:''},{id:'C003',company:'별빛스토어',contact:'최윤서',product:'약산성 토너',status:'후속연락',memo:''},{id:'C004',company:'다온코스메틱',contact:'정지호',product:'수분 세럼',status:'상담중',memo:''},{id:'C005',company:'온유마켓',contact:'박도현',product:'보습 크림',status:'완료',memo:''}];
const $=id=>document.getElementById(id);let rows=[],canSave=true;
function tell(text){$('feedback').textContent=text;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(rows));canSave=true;return true;}catch{canSave=false;tell('저장하지 못했습니다. 현재 화면에서만 유지됩니다. 브라우저 저장 설정을 확인해 주세요.');return false;}}
try{const raw=localStorage.getItem(KEY);if(raw===null){rows=seeds.map(x=>({...x}));save();}else{const parsed=JSON.parse(raw);if(!Array.isArray(parsed)||parsed.some(x=>!x||typeof x.company!=='string'||typeof x.contact!=='string'||!statuses.includes(x.status)))throw Error('invalid');rows=parsed.map(x=>({...x,memo:typeof x.memo==='string'?x.memo:''}));}}catch{canSave=false;tell('저장된 기록을 읽지 못했습니다. 기존 기록을 덮어쓰지 않도록 새로고침 후 저장 설정을 확인해 주세요.');}
function cell(tr,text){const td=document.createElement('td');td.textContent=text;tr.appendChild(td);return td;}
function render(){const query=$('search').value.trim().toLowerCase();const shown=rows.filter(x=>x.company.toLowerCase().includes(query));$('customers').replaceChildren();$('count').textContent=`전체 ${rows.length}명 · 검색 결과 ${shown.length}명`;$('empty').style.display=shown.length?'none':'block';for(const row of shown){const tr=document.createElement('tr');cell(tr,row.company);cell(tr,row.contact);cell(tr,row.product||'');const td=cell(tr,''),select=document.createElement('select');select.setAttribute('aria-label',`${row.company} 상담 상태`);for(const status of statuses){const option=document.createElement('option');option.value=status;option.textContent=status;select.appendChild(option);}select.value=row.status;select.addEventListener('change',()=>{row.status=select.value;if(canSave&&save())tell('상담 상태를 저장했습니다.');else tell('상태를 저장하지 못했습니다. 브라우저 저장 설정을 확인해 주세요.');});td.appendChild(select);cell(tr,row.memo);$('customers').appendChild(tr);}}
$('customer-form').addEventListener('submit',event=>{event.preventDefault();const company=$('company').value.trim(),contact=$('contact').value.trim();if(!company||!contact){tell('회사명과 담당자를 입력해 주세요.');(!company?$('company'):$('contact')).focus();return;}if(!canSave){tell('저장 기능을 사용할 수 없습니다. 기존 기록 보존을 위해 추가를 중단합니다.');return;}rows.push({id:'C-'+Date.now()+'-'+rows.length,company,contact,product:$('product').value.trim(),status:$('new-status').value,memo:$('memo').value.trim()});const ok=save();render();if(ok){$('customer-form').reset();tell('고객을 추가하고 저장했습니다.');}});
$('search').addEventListener('input',render);render();
})();
</script></body></html>
