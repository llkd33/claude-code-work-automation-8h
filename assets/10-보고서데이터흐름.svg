<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
<title id="title">원본에서 내 결과까지의 흐름</title>
<desc id="desc">workbooks 폴더의 제공 원본은 보존하고 내주간비용.xlsx 사본만 수정합니다. 검증된 local-report 도구를 실행하면 report.html, summary.json, share.txt, verification.json이 만들어집니다. 내 사본 결과는 output/my-costs입니다. 공통 제공 수정후 파일 결과는 output/local-final이며 3명 팀이 읽습니다. 같은 숫자를 보고서와 팀에서 사용합니다.</desc>
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#f63c51" stroke-width="1.8"/></marker></defs>
<rect x="64" y="190" width="360" height="190" rx="18" fill="#f7f7f9" stroke="#d9dce3" stroke-width="2"/>
<rect x="536" y="190" width="360" height="190" rx="18" fill="#fcecef" stroke="#f63c51" stroke-width="2"/>
<rect x="1008" y="190" width="368" height="190" rx="18" fill="#f7f7f9" stroke="#d9dce3" stroke-width="2"/>
<path d="M 428 285 L 529 285" fill="none" stroke="#f63c51" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 900 285 L 1001 285" fill="none" stroke="#f63c51" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1192 384 L 1192 426 L 720 426 L 720 459" fill="none" stroke="#f63c51" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="280" y="465" width="880" height="213" rx="18" fill="#fcecef" stroke="#f63c51" stroke-width="2"/>
<rect x="64" y="727" width="632" height="145" rx="18" fill="#f7f7f9" stroke="#d9dce3" stroke-width="2"/>
<rect x="744" y="727" width="632" height="145" rx="18" fill="#f7f7f9" stroke="#d9dce3" stroke-width="2"/>
<text x="64" y="42" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="38" font-weight="700" fill="#161616">D03  /  원본에서 내 결과까지의 흐름</text>
<text x="64" y="103" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">원본을 보존하고, 수정한 사본으로 검증된 도구를 실행합니다.</text>
<text x="88" y="214" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">제공 원본</text>
<text x="88" y="267" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">workbooks/*.xlsx</text>
<text x="88" y="305" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">읽기만 · 원본 보존</text>
<text x="560" y="214" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">내 Excel 사본</text>
<text x="560" y="267" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">내주간비용.xlsx</text>
<text x="560" y="305" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">내가 수정 · 저장</text>
<text x="1032" y="214" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">local-report 도구</text>
<text x="1032" y="267" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">입력 검사 → 실제 계산</text>
<text x="1032" y="305" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">정상일 때 결과 저장</text>
<text x="304" y="489" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">결과 파일 4개</text>
<text x="304" y="542" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">report.html = 보는 보고서 / summary.json = 숫자</text>
<text x="304" y="580" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">share.txt = 공유 문안 / verification.json = 이번 검사</text>
<text x="304" y="618" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">파일 확인 + 숫자 확인 + ok: true 확인</text>
<text x="88" y="751" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">내 사본 실습 결과</text>
<text x="88" y="804" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">output/my-costs</text>
<text x="768" y="751" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">공통 제공 수정후 파일 결과</text>
<text x="768" y="804" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">output/local-final → 3명 팀 입력</text>
</svg>