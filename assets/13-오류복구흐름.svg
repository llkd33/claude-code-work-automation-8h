<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="890" viewBox="0 0 1440 890" role="img" aria-labelledby="title desc">
<title id="title">오류 뒤에는 검사 결과부터 읽기</title>
<desc id="desc">입력이 실패하면 마지막 정상 report.html, summary.json, share.txt 세 파일은 보존됩니다. 이번 verification.json의 ok: false와 오류 내용을 읽고 입력을 수정합니다. 같은 도구를 다시 실행하고 ok: true를 확인한 뒤 최신 결과를 사용합니다. 파일 존재만으로 새 성공을 판단하지 않습니다.</desc>
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#f63c51" stroke-width="1.8"/></marker></defs>
<rect x="64" y="190" width="632" height="190" rx="18" fill="#f7f7f9" stroke="#d9dce3" stroke-width="2"/>
<rect x="744" y="190" width="632" height="190" rx="18" fill="#fcecef" stroke="#f63c51" stroke-width="2"/>
<path d="M 1060 385 L 1060 426 L 252 426 L 252 469" fill="none" stroke="#f63c51" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="64" y="475" width="376" height="190" rx="18" fill="#f7f7f9" stroke="#d9dce3" stroke-width="2"/>
<rect x="532" y="475" width="376" height="190" rx="18" fill="#f7f7f9" stroke="#d9dce3" stroke-width="2"/>
<rect x="1000" y="475" width="376" height="190" rx="18" fill="#fcecef" stroke="#f63c51" stroke-width="2"/>
<path d="M 444 570 L 524 570" fill="none" stroke="#f63c51" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 912 570 L 992 570" fill="none" stroke="#f63c51" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="64" y="725" width="1312" height="121" rx="18" fill="#f7f7f9" stroke="#d9dce3" stroke-width="2"/>
<text x="64" y="42" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="38" font-weight="700" fill="#161616">D06  /  오류 뒤에는 검사 결과부터 읽기</text>
<text x="64" y="103" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">보고서가 남아 있다는 사실과 이번 입력이 성공했다는 사실은 다릅니다.</text>
<text x="88" y="214" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">마지막 정상 결과 3개</text>
<text x="88" y="267" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">report.html / summary.json / share.txt</text>
<text x="88" y="305" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">이전 성공 결과를 보존합니다.</text>
<text x="768" y="214" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">이번 입력은 실패</text>
<text x="768" y="267" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">verification.json → ok: false</text>
<text x="768" y="305" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">오류 행 · 항목을 읽습니다.</text>
<text x="88" y="499" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">1. 입력을 고치기</text>
<text x="88" y="552" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">오류를 기록합니다.</text>
<text x="88" y="590" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">사본 수정 후 저장</text>
<text x="556" y="499" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">2. 같은 도구 실행</text>
<text x="556" y="552" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">경로를 확인합니다.</text>
<text x="556" y="590" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">재검사 · 다시 생성</text>
<text x="1024" y="499" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">3. 최신 결과 사용</text>
<text x="1024" y="552" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">ok: true 먼저 확인</text>
<text x="1024" y="590" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">브라우저 새로고침</text>
<text x="88" y="749" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="700" fill="#161616">성공 판단 기준</text>
<text x="88" y="802" dominant-baseline="text-before-edge" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#606877">파일이 있음 + 이번 verification.json의 ok: true + 실제 숫자 확인</text>
</svg>